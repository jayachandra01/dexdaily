:root{color-scheme:light dark;--bg:light-dark(#FFFFFF,#0F1A20);--ink:light-dark(#0F1A20,#EEF3F4);--mute:light-dark(#5A6770,#A7B6BD);--plane:light-dark(#E4E8EA,#27393F);--soft:light-dark(#F4F6F7,#15232B);--line:light-dark(#E4E8EA,#27393F);--amber:light-dark(#C97010,#E9A24A);--amberdeep:light-dark(#A45B0C,#E9A24A);--ambersoft:light-dark(#FBF1E3,#1C2E37);--teal:light-dark(#0E5A6E,#5CCBD1);--tealwash:light-dark(#E6F0F2,#1C2E37);--bad:light-dark(#B5452A,#E9A24A);--btnink:light-dark(#0F1A20,#EEF3F4);--btntext:light-dark(#FFFFFF,#0F1A20)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(4vw,16px)}
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{height:26px;width:auto;display:block}
.lw{fill:#1A1716}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lw{fill:#EFEDEB}}
:root[data-theme=dark] .lw{fill:#EFEDEB}
.prod{font:500 13px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--mute);border-left:1px solid var(--line);padding-left:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mute);padding:10px 12px;min-height:44px;cursor:pointer;font-weight:500;border-radius:8px}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{color:var(--ink);background:var(--soft)}
nav button:focus-visible,.btn:focus-visible,.seg button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{padding-block:clamp(20px,3vw,40px)}
h1{font-size:clamp(30px,4vw,44px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 12px;font-weight:600;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
.mute{color:var(--mute)}
.small{font-size:14px}
.today{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,32px);background:var(--bg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.tag{background:var(--tealwash);color:var(--teal);padding:3px 9px;border-radius:999px;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;white-space:nowrap}
.tag.y{background:var(--ambersoft);color:var(--amberdeep)}
.hook{font-size:19px;font-weight:500;margin:0 0 14px}
.note{background:var(--soft);border-left:3px solid var(--amber);padding:10px 14px;margin:12px 0;border-radius:0}
.trail{font-size:14px;color:var(--mute);margin-top:8px}
.trail button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--teal);font-size:14px}
.res{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.res li{display:grid;grid-template-columns:9.5em minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.res .lab{font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;color:var(--mute)}
.res .t{font-weight:500}
.res .by{font-size:14px;color:var(--mute)}
.res a.go{font-size:14px;font-weight:500;white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--teal)}
.res a.go:hover{background:var(--tealwash)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.pri,.btn.ink{background:var(--btnink);color:var(--btntext);border-color:var(--btnink)}
.btn.pri:hover,.btn.ink:hover{opacity:.9}
.btn.on{background:var(--tealwash);color:var(--teal);border-color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.side{display:grid;gap:16px}
.panel{background:var(--soft);border-radius:12px;padding:18px;border:1px solid var(--line)}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.bars{display:grid;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:8em minmax(0,1fr) 2em;gap:8px;align-items:center;font-size:14px}
.track{height:8px;background:var(--plane);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--teal)}
.bar.off{opacity:.4}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.due{font:500 11px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:var(--ambersoft);color:var(--amberdeep);padding:1px 6px;border-radius:999px;margin-left:4px}
.mini{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mini button{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
.mini button[aria-current=true]{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--amber)}
.mini b{display:block;font-size:15px;font-weight:500}
.mini span{font-size:13px;color:var(--mute)}
.banner{background:var(--soft);border:1px solid var(--line);padding:12px 14px;border-radius:8px;margin-bottom:16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--teal);text-decoration:underline;cursor:pointer}
.banner.err{border-color:var(--bad);color:var(--bad)}
.form{max-width:760px;display:grid;gap:22px}
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:500}
input[type=text],input[type=password],input[type=email],input[type=time],input[type=number],input[type=search],textarea,select{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
.ptable{display:grid;gap:0;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .pn{font-weight:500}
.prow .pe{font-size:13px;color:var(--mute);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:8px 10px;min-height:40px;cursor:pointer;font-size:14px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--btnink);color:var(--btntext)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding-right:8px}
.chk input{width:20px;height:20px;accent-color:#0E5A6E}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:12px}
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22em),1fr));gap:16px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.wk li{grid-template-columns:7.5em minmax(0,1fr) auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.modal{position:fixed;inset:0;background:color-mix(in srgb,#0F1A20 55%,transparent);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:420px}
.news{display:grid;gap:14px;margin-top:18px}
.news .card{padding:20px}
.news h3{font-size:18px;margin:8px 0 6px}
.vlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vlist a{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--bg)}
.vlist a:hover{background:var(--tealwash)}
.src{font-size:13px;color:var(--mute);margin-top:6px}
.src a{margin-right:10px}
footer{padding-block:24px;font-size:13px;color:var(--mute)}
@media (max-width:860px){.today{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.res li{grid-template-columns:minmax(0,1fr) auto}.res .lab{grid-column:1/-1}.prow{grid-template-columns:minmax(0,1fr)}nav button{padding:10px 8px}.prod{display:none}}
</style>

  if(a==='weekly')run('Building your list',weekly);
  if(a==='reset'){confirmReset=true;render()}
  if(a==='backup'){const blob=new Blob([JSON.stringify({dexdaily:1,saved:Date.now(),state:S},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='dexdaily-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);info='Backup downloaded.';render()}
  if(a==='reset-no'){confirmReset=false;render()}
  if(a==='reset-yes'){confirmReset=false;S={v:1,profile:null,drops:[],weekly:{},stock:[],skipped:{},m:{res:0}};cur=null;draft=null;view='today';save();render()}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='pf')return;e.preventDefault();readForm();const isNew=!S.profile;S.profile=migrate(JSON.parse(JSON.stringify(draft)));info='';await save();
  if(isNew){draft=null;view='today';render();if(hasAI())run('Fetching your first topics',async()=>{if(dueCount()>0)await releaseDue();else await extraTopic()});else render()}else{info='Saved. New drops will follow these settings.';render()}});
document.addEventListener('change',async e=>{if(e.target.id!=='restore'||!e.target.files[0])return;try{const j=JSON.parse(await e.target.files[0].text());if(!j||!j.state||!Array.isArray(j.state.drops))throw 0;S=Object.assign({v:1,profile:null,drops:[],weekly:{},stock:[],skipped:{},m:{res:0}},j.state);if(!Array.isArray(S.stock))S.stock=[];if(S.profile)S.profile=migrate(S.profile);save();cur=null;draft=S.profile?JSON.parse(JSON.stringify(S.profile)):null;info='Restored '+S.drops.length+' topics from your backup.'}catch(_){err='That file is not a DEX Daily backup.'}render()});
document.addEventListener('input',e=>{if(e.target.id==='libq'){libQ=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('libq');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h)&&h!==view)setView(h)});
const h0=location.hash.slice(1);if(NAV.some(n=>n[0]===h0))view=h0;

(async()=>{await load();render();if(S.profile&&view==='today')deliverDue();
  setInterval(()=>{if(S.profile&&!busy&&document.visibilityState==='visible'&&view==='today'){render()}},60000)})();
}
</script>
</body>
